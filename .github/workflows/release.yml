name: Build and release

# Builds the tweak dylibs on a macOS runner (Xcode + iOS SDK) and, for a
# version tag like v1.1.0, publishes them as a GitHub release.
# Run it by hand (Actions tab -> Run workflow) to just build and get the
# dylibs as a downloadable artifact without releasing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to release, e.g. v1.1.0 (leave empty to only build)'
        required: false
        default: ''
      ref:
        description: 'Optional commit/branch to build instead of this one (published as a pre-release)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Build release dylib
        run: |
          MPAB_LOG_ALL=0 ./build.sh
          mkdir -p dist
          cp MarketplaceAdBlock.dylib dist/MarketplaceAdBlock.dylib

      - name: Build debug dylib
        run: |
          MPAB_LOG_ALL=1 ./build.sh
          cp MarketplaceAdBlock.dylib dist/MarketplaceAdBlock-debug.dylib

      - name: Check the builds
        run: |
          file dist/*.dylib
          # The release dylib must not contain the debug-only log strings.
          if strings dist/MarketplaceAdBlock.dylib | grep -qE 'item types|query %\{public\}@'; then
            echo "release dylib looks like a debug build" >&2
            exit 1
          fi
          strings dist/MarketplaceAdBlock-debug.dylib | grep -q 'item types'

      - name: Diagnostics (load commands vs the upstream release)
        continue-on-error: true
        run: |
          for f in dist/*.dylib; do
            echo "=== $f"; otool -L "$f"; vtool -show-build "$f" | head -12
            codesign -dv "$f" 2>&1 | head -6
            otool -l "$f" | grep -E 'LC_DYLD_CHAINED|LC_DYLD_INFO|LC_ID_DYLIB' || true
          done
          if curl -fsSL -o upstream.dylib https://github.com/adamsardo/MarketplaceAdBlock/releases/latest/download/MarketplaceAdBlock.dylib; then
            echo "=== upstream release dylib"; otool -L upstream.dylib; vtool -show-build upstream.dylib | head -12
            codesign -dv upstream.dylib 2>&1 | head -6
            otool -l upstream.dylib | grep -E 'LC_DYLD_CHAINED|LC_DYLD_INFO|LC_ID_DYLIB' || true
          else
            echo "upstream release dylib not downloadable"
          fi
          echo "built commit: $(git rev-parse HEAD)"

      - uses: actions/upload-artifact@v4
        with:
          name: dylibs
          path: dist/*.dylib

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
          PRE: ${{ inputs.ref != '' && '--prerelease' || '' }}
        run: |
          # --target makes gh create the tag at the built commit if it doesn't exist yet.
          gh release create "$TAG" dist/*.dylib \
            --target "$(git rev-parse HEAD)" --title "$TAG" --generate-notes $PRE
